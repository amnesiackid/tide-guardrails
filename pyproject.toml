[project]
name = "tide-guardrails"
version = "0.1.0"
description = "Input/output guardrails around a deliberately unaligned local LLM, demoed as a customer-service chatbot"
requires-python = ">=3.12"
dependencies = [
    "guardrails-ai>=0.11.0",
    "guardrails-ai-detect-jailbreak>=0.1.6",
    "guardrails-ai-detect-pii>=0.0.6",
    "guardrails-ai-restrict-to-topic>=0.1.0",
    "guardrails-ai-toxic-language>=0.0.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "transformers<5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tide_guardrails"]